name: Validate AI Agent Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality gate dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test quality gates (positive and negative cases)
        run: python -m unittest discover -s tests -v
      - name: Check generated single-plugin bundle
        run: python scripts/build_single_plugin.py --check
      - name: Validate source repository
        run: python scripts/validate_repo.py
      - name: Validate installable Antigravity plugin
        run: python scripts/validate_plugin.py
      - name: Validate explicit agent tool allowlists
        run: python scripts/validate_agent_tools.py
