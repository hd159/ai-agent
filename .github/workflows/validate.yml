name: Validate AI Agent Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality gate dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build canonical root plugin bundle from modules
        run: python scripts/build_single_plugin.py
      - name: Verify generated root bundle is committed and synchronized
        run: git diff --exit-code -- plugin.json .codex-plugin agents skills rules
      - name: Check canonical root plugin bundle
        run: python scripts/build_single_plugin.py --check
      - name: Build native adapters
        run: python scripts/build_adapters.py --adapter all
      - name: Validate native adapters
        run: python scripts/validate_adapters.py
      - name: Validate root-shared Codex, Claude Code, and Cursor marketplaces
        run: python scripts/validate_marketplaces.py
      - name: Test quality gates, installers, and marketplaces
        run: python -m unittest discover -s tests -v
      - name: Validate source repository
        run: python scripts/validate_repo.py
      - name: Validate installable Antigravity plugin
        run: python scripts/validate_plugin.py
      - name: Validate explicit Antigravity tool allowlists
        run: python scripts/validate_agent_tools.py
      - name: Validate Antigravity capabilities and compatibility
        run: python scripts/validate_capabilities.py
